<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operação SALVO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4FB; --surface:#FFFFFF; --sunk:#ECE8F6; --ink:#17112A; --muted:#5E5873; --line:#D9D3EA;
  --pri:#D80F75; --pri-ink:#FFFFFF; --tint:#FCE3F0;
  --blue:#2747E8; --yellow:#FFC21A; --orange:#FF6B1A;
  --alarm:#D7341B; --alarm-bg:#FDE6E1; --ok:#0B8A6A; --ok-bg:#DDF4EC; --warn:#8A5300; --warn-bg:#FFF0CC;
  --display:"Chakra Petch","Archivo",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120E1D; --surface:#1D1730; --sunk:#0D0A16; --ink:#F3F0FA; --muted:#ABA3C2; --line:#352C4F;
    --pri:#FF4FA0; --pri-ink:#1A0410; --tint:#3A1530;
    --blue:#8EA2FF; --yellow:#FFD45A; --orange:#FF8F52;
    --alarm:#FF7A63; --alarm-bg:#3D1712; --ok:#4FD3A8; --ok-bg:#0F3328; --warn:#FFC968; --warn-bg:#3A2A07;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120E1D; --surface:#1D1730; --sunk:#0D0A16; --ink:#F3F0FA; --muted:#ABA3C2; --line:#352C4F;
  --pri:#FF4FA0; --pri-ink:#1A0410; --tint:#3A1530;
  --blue:#8EA2FF; --yellow:#FFD45A; --orange:#FF8F52;
  --alarm:#FF7A63; --alarm-bg:#3D1712; --ok:#4FD3A8; --ok-bg:#0F3328; --warn:#FFC968; --warn-bg:#3A2A07;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}

/* Barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.stripe{height:5px;background:linear-gradient(90deg,var(--pri) 0 25%,var(--orange) 25% 50%,var(--yellow) 50% 75%,var(--blue) 75% 100%)}
.brand{font-family:var(--display);font-weight:700;font-size:20px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.spacer{flex:1}

.vault{display:flex;gap:8px}
.slot{width:44px;height:52px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px;border-radius:8px;background:var(--sunk);border:2px dashed var(--line);color:var(--muted)}
.slot.on{background:var(--pri);border:2px solid var(--pri);color:var(--pri-ink)}
.slot.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.slot.pop{animation:none}}

main{padding:28px 0 64px}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.1;margin:0 0 12px}
h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.15;margin:0 0 8px}
h3{font-size:18px;margin:28px 0 10px}
p{margin:0 0 14px;max-width:68ch}
.lead{font-size:19px}
.muted{color:var(--muted)}
.level-tag{display:inline-block;font-weight:700;font-size:14px;color:var(--pri);margin-bottom:6px}
.situ{background:var(--tint);border-left:5px solid var(--pri);padding:14px 18px;border-radius:0 8px 8px 0;margin:16px 0 20px}
.situ p:last-child{margin:0}

/* E-mails */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}
.mail-head{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 16px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:15px}
.mail-head b{color:var(--muted);font-weight:500}
.mail-id{font-family:var(--display);font-weight:700;font-size:18px;grid-row:span 2;align-self:center;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.mail-body{padding:12px 16px;font-size:16px}
.mail-body p{margin:0 0 8px}
.fake-link{color:var(--blue);text-decoration:underline;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.link-dest{display:block;margin-top:6px;font-size:14px;background:var(--warn-bg);color:var(--warn);padding:6px 10px;border-radius:4px}

/* Opções */
.opts{display:grid;gap:8px;margin:0 0 8px}
.opts.cols{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--pri);width:18px;height:18px;flex:none}
.opt:has(input:checked){border-color:var(--pri);background:var(--tint)}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-row .opt{min-width:72px;justify-content:center;font-family:var(--display);font-weight:700;font-size:20px}
.radio-row .opt input{margin-top:6px}

/* Nível 2: console */
.console{display:grid;gap:10px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.acc-top{display:grid;grid-template-columns:32px minmax(120px,180px) 1fr auto;gap:12px;align-items:start;padding:12px 14px}
.acc-n{font-family:var(--display);font-weight:700;color:var(--muted)}
.acc-name{font-weight:700;word-break:break-word}
.acc-sit{font-size:15px}
.acc .chk{display:flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600;font-size:15px;cursor:pointer}
.acc .chk input{width:20px;height:20px;accent-color:var(--alarm)}
.acc.flag{border-color:var(--alarm)}
.acc.flag .acc-top{background:var(--alarm-bg)}
.fix{display:none;border-top:1px dashed var(--line);padding:12px 14px 14px 58px;background:var(--sunk)}
.acc.flag .fix{display:grid;gap:12px}
.fix-title{font-size:14px;font-weight:700;color:var(--muted);margin:0}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ctl > span:first-child{min-width:210px;font-size:15px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.toggle label{padding:5px 14px;font-size:14px;font-weight:600;cursor:pointer;position:relative}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle label:has(input:checked){background:var(--ink);color:var(--surface)}
.toggle label:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:-3px}
.pw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pw input{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:200px}
.pw .meter{font-size:13px;font-weight:600}
.meter.weak{color:var(--alarm)} .meter.strong{color:var(--ok)}
.btn.sm{padding:7px 14px;font-size:15px}
.prog{width:200px;height:10px;border-radius:5px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width 1.6s linear}
.saved{font-size:13px;color:var(--ok);font-weight:600}
@media (max-width:640px){
  .acc-top{grid-template-columns:28px 1fr;}
  .acc-top .acc-sit,.acc-top .chk{grid-column:2}
  .fix{padding-left:14px}
  .ctl > span:first-child{min-width:0;width:100%}
}

/* Nível 3: conversa */
.phone{max-width:380px;margin:0 auto 16px;border-radius:28px;border:10px solid #1B1626;background:#1B1626;box-shadow:0 18px 40px rgba(23,17,42,.25);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111}
.ph-status{display:flex;justify-content:space-between;font-size:12px;color:#fff;padding:4px 14px 6px;background:#0E5E4F}
.ph-head{display:flex;align-items:center;gap:10px;background:#0E5E4F;color:#fff;padding:6px 12px 10px}
.ph-av{width:38px;height:38px;border-radius:50%;background:#7A8C9E;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;flex:none;overflow:hidden}
.ph-name{font-weight:600;font-size:15px;line-height:1.2}
.ph-sub{font-size:12px;opacity:.85}
.ph-chat{background:#E9E2D9;padding:12px 10px 14px;display:flex;flex-direction:column;gap:6px;min-height:420px}
.ph-sys{align-self:center;background:#FFF6C9;color:#5B4A00;font-size:12px;padding:6px 10px;border-radius:8px;text-align:center;max-width:92%}
.ph-day{align-self:center;background:#DDE8EE;color:#3D4B55;font-size:11px;padding:3px 10px;border-radius:6px}
.msg{max-width:82%;padding:6px 9px 4px;border-radius:8px;font-size:14px;line-height:1.35;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.msg.in{align-self:flex-start;background:#fff;border-top-left-radius:2px}
.msg.out{align-self:flex-end;background:#D7F5C4;border-top-right-radius:2px}
.msg time{display:block;text-align:right;font-size:10.5px;color:#6B7780;margin-top:2px}
.ph-notif{margin:4px 0;background:rgba(255,255,255,.92);border-radius:12px;padding:8px 10px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.ph-notif b{display:block;font-size:12px;color:#555}
.ph-input{display:flex;gap:8px;align-items:center;background:#F0F0F0;padding:8px 10px}
.ph-input span{flex:1;background:#fff;border-radius:18px;padding:7px 12px;font-size:13px;color:#8A8A8A}

/* Nível 4: cena */
.scene-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#F3EFE6}
.scene-wrap svg{display:block;width:100%;min-width:760px;height:auto}
.hot{cursor:pointer}
.hot .hit{fill:transparent;stroke:transparent;stroke-width:4;rx:10}
.hot:hover .hit,.hot:focus-visible .hit{stroke:#2747E8;stroke-dasharray:6 5}
.hot:focus{outline:none}
.hot.sel .hit{stroke:#D80F75;stroke-width:5;stroke-dasharray:none;fill:rgba(216,15,117,.10)}
.hot .mark{display:none}
.hot.sel .mark{display:block}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:14px;background:var(--tint);color:var(--ink);border:1px solid var(--pri);border-radius:999px;padding:3px 10px}

/* Nível 5: arrastar */
.pool{min-height:70px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:2px dashed var(--line);border-radius:10px;background:var(--surface);margin-bottom:14px}
.pool:empty::after{content:"Todas as cartas foram distribuídas.";color:var(--muted);font-size:15px;align-self:center}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.cols4{grid-template-columns:repeat(2,1fr)}}
.zone{border-radius:10px;background:var(--sunk);border:2px solid transparent;display:flex;flex-direction:column;min-height:220px}
.zone h4{margin:0;padding:10px 12px;font-family:var(--display);font-size:18px;border-radius:8px 8px 0 0;color:#fff}
.zone[data-z="agora"] h4{background:var(--pri)}
.zone[data-z="seguida"] h4{background:var(--orange)}
.zone[data-z="depois"] h4{background:var(--blue)}
.zone[data-z="lixo"] h4{background:#4A4458}
.zone .drop{flex:1;display:flex;flex-direction:column;gap:8px;padding:10px}
.zone.over{border-color:var(--ink)}
.zone.can{cursor:pointer;border-style:dashed;border-color:var(--pri)}
.dcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:8px;padding:9px 11px;font-size:14.5px;line-height:1.35;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.pool .dcard{flex:1 1 240px}
.dcard.picked-up{outline:3px solid var(--pri);outline-offset:1px}
.dcard.ghost{opacity:.35}
.drag-clone{position:fixed;z-index:50;pointer-events:none;box-shadow:0 12px 28px rgba(0,0,0,.25);transform:rotate(-2deg);max-width:300px}

/* Ações */
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:8px;padding:12px 20px;font-weight:700;font-size:17px;background:var(--pri);color:var(--pri-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--alarm);color:#fff}
.note{padding:12px 16px;border-radius:8px;margin:16px 0;font-weight:500}
.note.bad{background:var(--alarm-bg);color:var(--alarm)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.hint{background:var(--warn-bg);color:var(--warn)}

/* Finais */
.finale{text-align:center;padding:40px 0}
.finale .big{font-family:var(--display);font-weight:700;font-size:clamp(56px,14vw,128px);line-height:1;margin:10px 0 20px}
.finale.win .big{color:var(--ok)}
.finale.lose .big{color:var(--alarm)}
.finale p{margin-left:auto;margin-right:auto}
.extra{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:24px}
.extra textarea{width:100%;min-height:140px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical;line-height:1.5}

/* Início */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0 28px}
.pick button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 12px;font-family:var(--display);font-weight:600;font-size:22px}
.pick button:hover{border-color:var(--pri)}
.small-links{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}
.small-links button{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline}

/* Telão e painel */
.giant{font-family:var(--display);font-weight:700;font-size:clamp(80px,20vw,220px);line-height:1;font-variant-numeric:tabular-nums;text-align:center;margin:10px 0}
.giant.mid{font-size:clamp(64px,12vw,140px)}
.giant.hot{color:var(--alarm)}
.giant-label{text-align:center;font-size:20px;color:var(--muted);margin:0 auto}
.board{display:grid;gap:10px;margin-top:28px}
.row{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;flex-wrap:wrap}
.row .gname{font-family:var(--display);font-weight:600;font-size:22px;min-width:110px}
.row .meta{font-size:14px;color:var(--muted)}
.row.done{border-color:var(--ok)}
.badge{font-size:13px;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--sunk)}
.badge.lock{background:var(--alarm-bg);color:var(--alarm)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:20px}
.qr{background:#fff;color:#17112A;border-radius:10px;padding:12px;text-align:center;border:1px solid var(--line)}
.qr svg{width:100%;height:auto;display:block}
.qr b{display:block;font-family:var(--display);font-size:22px;margin-top:6px}
.qr .fallback{font-size:12px;word-break:break-all}
details.gab{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-top:24px}
details.gab summary{font-weight:700;cursor:pointer}
details.gab li{margin-bottom:6px}
.msgs{display:grid;gap:10px;margin-top:10px}
.msgs blockquote{margin:0;background:var(--sunk);border-left:4px solid var(--pri);padding:10px 14px;border-radius:0 8px 8px 0;white-space:pre-wrap}
.offline{font-size:14px;color:var(--muted);margin-top:8px}

@media (max-width:600px){
  h1{font-size:32px}
  .slot{width:36px;height:44px;font-size:22px}
  body{font-size:16px}
}
</style>
</head>

function fmt(ms){ if(ms<0) ms=0; var s=Math.ceil(ms/1000), m=Math.floor(s/60), r=s%60; return (m<10?"0":"")+m+":"+(r<10?"0":"")+r; }
function lsGet(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }

/* ---------- Dados compartilhados (opcional) ---------- */
var db=null, dbWritable=true, sessao=null, grupos={}, sessaoUnsub=null, gruposUnsub=null, writeChains={};
function writeDoc(path,data){
  if(!db||!dbWritable) return Promise.resolve();
  var prev=writeChains[path]||Promise.resolve();
  var next=prev.then(function(){ return db.doc(path).set(data).catch(function(e){ if(e&&e.code==="invalid_argument") dbWritable=false; }); });
  writeChains[path]=next; return next;
}
function deleteDoc(path){
  if(!db||!dbWritable) return Promise.resolve();
  var prev=writeChains[path]||Promise.resolve();
  var next=prev.then(function(){ return db.doc(path).delete().catch(function(){}); });
  writeChains[path]=next; return next;
}
function subscribe(){
  if(!db) return;
  if(!sessaoUnsub) sessaoUnsub=db.doc("sessao/atual").onSnapshot(function(s){ sessao=s.exists?s.data():null; onShared(); },function(){ sessaoUnsub=null; });
  if(!gruposUnsub) gruposUnsub=db.collection("grupos").onSnapshot(function(s){ var g={}; s.docs.forEach(function(d){ g[d.id]=d.data(); }); grupos=g; onShared(); },function(){ gruposUnsub=null; });
}
function rodadaAtual(){ return sessao && typeof sessao.rodada==="number" ? sessao.rodada : 0; }

/* ---------- Rotas ---------- */
var mode=null, groupNum=null;
function route(){
  var h=(location.hash||"").replace("#","");
  var m=h.match(/^grupo([1-6])$/);
  if(m){ mode="grupo"; groupNum=+m[1]; renderGroup(true); }
  else if(h==="telao"){ mode="telao"; renderTelao(); }
  else if(h==="painel"){ mode="painel"; renderPainel(); }
  else { mode="inicio"; renderStart(); }
}
window.addEventListener("hashchange",route);
function go(h){ if(location.hash==="#"+h) route(); else location.hash=h; }
function onShared(){ if(mode==="grupo") syncGroupFromShared(); else if(mode==="telao") updateTelao(); else if(mode==="painel") updatePainel(); }

/* ---------- Grupo ---------- */
var G=null, currentView=null;
function gKey(){ return "salvo-grupo-"+groupNum; }
function freshGroup(r){ return {rodada:r||0,nivel:0,lockUntil:0,dicas:[],erros:0,startLocal:0,concluidoEm:0,extra:""}; }
function saveGroup(){
  lsSet(gKey(),G);
  writeDoc("grupos/g"+groupNum,{grupo:groupNum,nivel:G.nivel,letras:CODE.slice(0,G.nivel).join(""),erros:G.erros,dicas:G.dicas.length,lockUntil:G.lockUntil,concluidoEm:G.concluidoEm,rodada:G.rodada,extra:G.extra||"",atualizadoEm:Date.now()});
}
function startAt(){
  if(sessao&&sessao.status==="rodando"&&sessao.startAt) return sessao.startAt;
  if(!db&&G&&G.startLocal) return G.startLocal;
  return 0;
}
function duracaoMs(){ return ((sessao&&sessao.duracaoMin)||DURACAO_PADRAO)*60000; }
function remaining(){ var s=startAt(); return s?(s+duracaoMs()-Date.now()):null; }
function syncGroupFromShared(){
  if(!G) return;
  var r=rodadaAtual();
  if(r!==G.rodada){ G=freshGroup(r); saveGroup(); renderGroup(false); return; }
  if(currentView!==viewName()) renderGroup(false);
}
function viewName(){
  if(!G) return "none";
  if(G.nivel>=5) return "win";
  var rem=remaining();
  if(rem===null) return "wait";
  if(rem<=0) return "lose";
  return "level"+G.nivel;
}
function renderGroup(load){
  if(load||!G){ G=lsGet(gKey())||freshGroup(rodadaAtual()); if(!Array.isArray(G.dicas)) G.dicas=[]; }
  currentView=viewName();
  app.innerHTML=""; app.appendChild(el('<div>'+topBar(true)+'<main class="wrap" id="stage"></main></div>'));
  paintVault(-1);
  var stage=document.getElementById("stage"), v=currentView;
  if(v==="wait") stage.appendChild(waitView());
  else if(v==="win") stage.appendChild(winView());
  else if(v==="lose") stage.appendChild(loseView());
  else stage.appendChild(levelView(G.nivel));
  tick(); window.scrollTo(0,0);
}
function paintVault(popIndex){
  var v=document.getElementById("vault"); if(!v) return;
  v.querySelectorAll(".slot").forEach(function(s,i){
    s.classList.toggle("on",i<G.nivel);
    if(popIndex===i){ s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop"); }
  });
}

  var acts=el('<div class="actions"><button class="btn" id="submit">Enviar resposta</button>'+
    '<button class="btn ghost" id="hint"'+((left<=0||used)?' disabled':'')+'>'+(used?'Dica usada':'Usar dica ('+left+' restante'+(left===1?'':'s')+', custa 2 min)')+'</button>'+
    '<span class="muted" id="lockmsg"></span></div>');
  sec.appendChild(acts);

var L5held=null;
function buildL5(body,L){
  L5held=null;
  var zones=[["agora","Agora"],["seguida","Em seguida"],["depois","Depois"],["lixo","Lixo"]];
  var w=el('<div><p class="muted">Arrastem as cartas. Se preferirem, toquem numa carta e depois na coluna.</p>'+
    '<div class="pool" id="pool" data-z="pool">'+L.cartas.map(function(c,k){return '<div class="dcard" tabindex="0" data-k="'+k+'">'+esc(c.t)+'</div>';}).join("")+'</div>'+
    '<div class="cols4">'+zones.map(function(z){return '<div class="zone" data-z="'+z[0]+'"><h4>'+z[1]+'</h4><div class="drop" data-z="'+z[0]+'"></div></div>';}).join("")+'</div></div>');
  body.appendChild(w);
  var pool=w.querySelector("#pool");
  function zoneDrop(z){ return z==="pool"?pool:w.querySelector('.drop[data-z="'+z+'"]'); }
  function setHeld(card){
    if(L5held) L5held.classList.remove("picked-up");
    L5held=card; if(card) card.classList.add("picked-up");
    w.querySelectorAll(".zone").forEach(function(z){ z.classList.toggle("can",!!card); });
  }
  function moveTo(card,z){ zoneDrop(z).appendChild(card); setHeld(null); }
  w.querySelectorAll(".zone").forEach(function(z){
    z.addEventListener("click",function(){ if(L5held) moveTo(L5held,z.dataset.z); });
  });
  pool.addEventListener("click",function(e){ if(L5held&&e.target===pool) moveTo(L5held,"pool"); });
  w.querySelectorAll(".dcard").forEach(function(card){
    var sx=0,sy=0,dragging=false,clone=null,pid=null,offX=0,offY=0;
    card.addEventListener("pointerdown",function(e){
      if(e.button!==undefined&&e.button!==0) return;
      sx=e.clientX; sy=e.clientY; dragging=false; pid=e.pointerId;
      var r=card.getBoundingClientRect(); offX=e.clientX-r.left; offY=e.clientY-r.top;
      try{ card.setPointerCapture(pid); }catch(_){}
    });
    card.addEventListener("pointermove",function(e){
      if(pid!==e.pointerId) return;
      if(!dragging && Math.hypot(e.clientX-sx,e.clientY-sy)>6){
        dragging=true; setHeld(null);
        clone=card.cloneNode(true); clone.classList.add("drag-clone"); clone.style.width=card.getBoundingClientRect().width+"px";
        document.body.appendChild(clone); card.classList.add("ghost");
      }
      if(dragging){
        clone.style.left=(e.clientX-offX)+"px"; clone.style.top=(e.clientY-offY)+"px";
        var t=document.elementFromPoint(e.clientX,e.clientY), z=t&&t.closest?t.closest(".zone,.pool"):null;
        w.querySelectorAll(".zone,.pool").forEach(function(x){ x.classList.toggle("over",x===z); });
      }
    });
    function end(e){
      if(pid!==e.pointerId) return; pid=null;
      if(dragging){
        var t=document.elementFromPoint(e.clientX,e.clientY), z=t&&t.closest?t.closest(".zone,.pool"):null;
        if(z) moveTo(card,z.dataset.z);
        card.classList.remove("ghost"); if(clone) clone.remove(); clone=null;
        w.querySelectorAll(".over").forEach(function(x){ x.classList.remove("over"); });
        dragging=false;
      } else {
        setHeld(L5held===card?null:card);
      }
    }
    card.addEventListener("pointerup",end);
    card.addEventListener("pointercancel",function(e){ if(pid!==e.pointerId) return; pid=null; if(clone) clone.remove(); clone=null; card.classList.remove("ghost"); dragging=false; });
    card.addEventListener("click",function(e){ e.stopPropagation(); });
    card.addEventListener("keydown",function(e){
      if(e.key==="Enter"||e.key===" "){ e.preventDefault(); setHeld(L5held===card?null:card); }
      var map={"1":"agora","2":"seguida","3":"depois","4":"lixo","0":"pool"};
      if(map[e.key]){ moveTo(card,map[e.key]); card.focus(); }
    });
  });
}

    var card=app.querySelector('.dcard[data-k="'+k+'"]'); var d=card&&card.parentElement;

      else{
        var locked=g.lockUntil&&g.lockUntil>Date.now();
        meta=(nivel>=5?'<span class="badge ok">Concluiu'+(g.concluidoEm&&sessao&&sessao.startAt?' em '+fmt(g.concluidoEm-sessao.startAt):'')+'</span>':'<span class="badge">Nível '+(nivel+1)+'</span>')+
          (locked?' <span class="badge lock">Bloqueado '+fmt(g.lockUntil-Date.now())+'</span>':'')+
          ' <span class="meta">'+g.erros+' erro'+(g.erros===1?'':'s')+' · '+g.dicas+' dica'+(g.dicas===1?'':'s')+'</span>';
      }
    }
    return '<div class="row'+(nivel>=5?' done':'')+'"><span class="gname">Grupo '+n+'</span><div class="vault">'+slots+'</div><div class="spacer"></div>'+meta+'</div>';
  }).join("");
}

/* ---------- Painel ---------- */
function renderPainel(){
  app.innerHTML='<div>'+topBar(false)+'<main class="wrap" style="max-width:1000px">'+
    '<h1>Painel da facilitação</h1>'+
    '<div class="giant mid" id="pnclock">55:00</div><p class="giant-label" id="pnsub">até o ataque</p>'+
    '<div id="pnstatus"></div>'+
    '<div class="actions" id="pnctl" style="border-top:0;margin-top:8px;padding-top:0;justify-content:center"></div>'+
    '<div class="board" id="pnboard"></div>'+
    '<details class="gab" id="pnmsgsbox"><summary>Mensagens do desafio extra</summary><div class="msgs" id="pnmsgs"></div></details>'+
    '<details class="gab"><summary>QR codes dos grupos</summary>'+qrGrid(6)+'</details>'+
    '<details class="gab"><summary>Gabarito rápido</summary><ol>'+
      '<li><b>S:</b> e-mail C; ao menos 3 sinais verdadeiros e nenhum falso (falsos: anexo PDF, domingo, nome da fornecedora).</li>'+
      '<li><b>A:</b> marcar 1, 2, 4, 6 e 8 e corrigir: 1 senha forte salva e internet desligada; 2 conta desativada; 4 uma conta por pessoa; 6 acesso só com chamado; 8 instalar a 3.4.</li>'+
      '<li><b>L:</b> marcar não passar o código, ligar pelo número antigo ou central e avisar o plantão; não marcar responder na conversa, foto do crachá e passar o código. Palavra-código é opcional. Ao menos 3 sinais verdadeiros, nenhum falso.</li>'+
      '<li><b>V:</b> 7 problemas: computador logado, post-it, pen drive, Wi-Fi junto das geladeiras, alarme desligado, backup antigo, visitante sem crachá e sem agendamento. Certos: câmera, extintor, chaves. Aceita 6 de 7 se pen drive e visitante estiverem marcados.</li>'+
      '<li><b>O:</b> 3 armadilhas no lixo (apagar registros, postar nas redes, caçar quem clicou); desconectar e acionar plantão em Agora; controle manual e registrar em Agora ou Em seguida; avisar em Em seguida; descarte e lições em Depois.</li>'+
    '</ol></details>'+
    '<p class="offline">Telão: '+esc(ARTIFACT_URL)+'#telao</p>'+
  '</main></div>';
  updatePainel(); tick();
}
function updatePainel(){
  var st=document.getElementById("pnstatus"), ctl=document.getElementById("pnctl"), board=document.getElementById("pnboard"), msgs=document.getElementById("pnmsgs");
  if(!st) return;
  if(!db){
    st.innerHTML='<div class="note hint">Sem conexão com os dados compartilhados nesta tela. O desafio funciona em cada aparelho sozinho, mas o placar ao vivo, a largada sincronizada e as mensagens ficam desligados. Abra o painel, o telão e os grupos logados no claude.ai com uma conta que possa editar este site.</div>';
    ctl.innerHTML=""; board.innerHTML=""; msgs.innerHTML='<p class="muted">Indisponível sem conexão.</p>'; return;
  }
  var running=sessao&&sessao.status==="rodando";
  st.innerHTML=(running?'':'<p class="lead" style="text-align:center;margin:8px auto 0">Desafio ainda não iniciado. Os grupos podem escanear os QR codes no telão.</p>')+
    (!dbWritable?'<div class="note bad">Esta conta não pode gravar dados neste site. Use a conta dona do site no painel.</div>':'');
  ctl.innerHTML=(running?'<button class="btn ghost" id="pn-add">Adicionar 5 min</button>':'<button class="btn" id="pn-start">Dar a largada (55 min)</button>')+'<button class="btn danger" id="pn-reset">Nova rodada (zera tudo)</button>';
  var s=ctl.querySelector("#pn-start"), a=ctl.querySelector("#pn-add"), r=ctl.querySelector("#pn-reset"), rod=rodadaAtual();
  if(s) s.onclick=function(){ s.disabled=true; writeDoc("sessao/atual",{status:"rodando",startAt:Date.now(),duracaoMin:DURACAO_PADRAO,rodada:rod}); };
  if(a) a.onclick=function(){ a.disabled=true; writeDoc("sessao/atual",{status:"rodando",startAt:sessao.startAt,duracaoMin:(sessao.duracaoMin||DURACAO_PADRAO)+5,rodada:rod}); };
  if(r) r.onclick=function(){
    if(!confirm("Zerar o cronômetro e o progresso de todos os grupos?")) return;
    r.disabled=true;
    writeDoc("sessao/atual",{status:"aguardando",startAt:0,duracaoMin:DURACAO_PADRAO,rodada:rod+1}).then(function(){ return Promise.all([1,2,3,4,5,6].map(function(n){ return deleteDoc("grupos/g"+n); })); });
  };
  board.innerHTML=groupRows(true);
  var list=[1,2,3,4,5,6].map(function(n){ var g=grupos["g"+n]; return (g&&g.rodada===rod&&g.extra)?'<blockquote><b>Grupo '+n+'</b>\n'+esc(g.extra)+'</blockquote>':""; }).join("");
  msgs.innerHTML=list||'<p class="muted">Nenhuma mensagem ainda.</p>';
}

/* ---------- Relógio ---------- */
function setGiant(node,sub,s0,dur){
  if(!node) return;
  if(!s0){ node.textContent=fmt(dur); node.classList.remove("hot"); if(sub) sub.textContent="até o ataque"; return; }
  var rm=s0+dur-Date.now();
  if(rm<=0){ node.textContent="06:00"; node.classList.add("hot"); if(sub) sub.textContent="hora do ataque"; }
  else { node.textContent=fmt(rm); node.classList.toggle("hot",rm<5*60000); if(sub) sub.textContent="até o ataque"; }
}
var lastTelaoStarted=null;
function tick(){
  if(mode==="grupo"&&G){
    if(viewName()!==currentView){ renderGroup(false); return; }
    var lm=document.getElementById("lockmsg"), sb=document.getElementById("submit");
    if(lm&&sb&&!document.querySelector(".note.ok")){
      var left=G.lockUntil-Date.now();
      if(left>0){ sb.disabled=true; lm.textContent="Nova tentativa em "+fmt(left); } else { sb.disabled=false; lm.textContent=""; }
    }
  } else if(mode==="telao"){
    var s0=telaoStart();
    setGiant(document.getElementById("giant"),document.getElementById("giantsub"),s0,duracaoMs());
    var st=!!s0; if(st!==lastTelaoStarted){ lastTelaoStarted=st; updateTelao(); }
  } else if(mode==="painel"){
    setGiant(document.getElementById("pnclock"),document.getElementById("pnsub"),(sessao&&sessao.status==="rodando")?sessao.startAt:0,duracaoMs());
  }
}
setInterval(tick,500);
setInterval(function(){ if(mode==="painel"&&db){ var b=document.getElementById("pnboard"); if(b) b.innerHTML=groupRows(true); } },5000);

route();
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("db").then(function(d){ if(!d) return; db=d; subscribe(); route(); }).catch(function(){});
}
})();
</script>
